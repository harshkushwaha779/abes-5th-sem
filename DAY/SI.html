<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI CALCULATOR</title>
</head>
<body>
    <h1>SI CALCULATOR</h1>
    <form>
        <label for="principal">Principal:</label>
        <input type="number" id="principal" name="principal"><br><br>

        <label for="rate">Rate:</label>
        <input type="number" id="rate" name="rate"><br><br>

        <label for="time">Time:</label>
        <input type="number" id="time" name="time"><br><br>

        <input type="button" value="Calculate SI" onclick="calculateSI()">
    </form>

    <p id="result"></p>

    <script>
        function calculateSI() {
            var principal = document.getElementById("principal").value;
            var rate = document.getElementById("rate").value;
            var time = document.getElementById("time").value;

            var si = (principal * rate * time) / 100;

            document.getElementById("result").innerHTML = "Simple Interest: " + si;
        }
    </script>
</body>
</html>
