<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form>
      <input type="text" placeholder="USER_NAME" maxlength="30"
       required
          oninvalid="this.setCustomValidity('Username is required')"><br><br> 
      <input type="text" placeholder="ROLL_NO" maxlength="13"><br><br>
      <input type="text" placeholder="email"><br><br>
      <input type="password" placeholder="password" minlength="8"><br><br>
       <button>Submit</button>
    </form>
</body>
</html>
